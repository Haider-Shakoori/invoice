name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PDF validation runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-core

      - name: Prepare writable Laravel directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          chmod -R u+rwX bootstrap/cache storage

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Security audit
        run: composer audit

      - name: Style
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test

      - name: Release doctor
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan invoice:doctor --json

  tenancy-integration:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: invoice_central
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: invoice_central
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      RUN_TENANCY_MYSQL_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL backup client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends default-mysql-client

      - name: Prepare writable Laravel directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          chmod -R u+rwX bootstrap/cache storage

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_mysql
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run MySQL tenant isolation test
        run: php artisan test tests/Feature/Tenancy/TenantDatabaseIsolationMysqlTest.php
